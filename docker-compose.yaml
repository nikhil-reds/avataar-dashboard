# Local Postgres for the Avataar admin console.
# Credentials are development-only — do not reuse them anywhere deployed.

services:

  db:
    image: postgres:17
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: avataar
    ports:
      - "5432:5432"
    volumes:
      # Named volume, so conversations survive `docker compose down`. Without it the
      # container's data directory is discarded with the container.
      - avataar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avataar"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - avataar_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  avataar_db_data:
  avataar_redis_data:
