# Local Postgres for the Avataar admin console.
# Credentials are development-only — do not reuse them anywhere deployed.

services:

  db:
    image: postgres:17
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: avataar
    ports:
      - "5432:5432"
    volumes:
      # Named volume, so conversations survive `docker compose down`. Without it the
      # container's data directory is discarded with the container.
      - avataar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avataar"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  # Local LLM serving Qwen3. The avatar's answers are generated here, so no external API
  # and no API key is involved in a conversation.
  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "11434:11434"
    volumes:
      # Named volume so the pulled model survives `docker compose down` — re-pulling
      # Qwen3 is a multi-gigabyte download.
      - ollama_models:/root/.ollama
    environment:
      # Never unload. The default drops the model after 5 minutes idle, which means the
      # first question after any pause — exactly the one a visitor asks — pays a multi-
      # second reload before a single token is generated.
      OLLAMA_KEEP_ALIVE: "-1"
      # Frees KV-cache VRAM, which is what decides how much of the model fits on a 4GB
      # card. Harmless on larger ones.
      OLLAMA_FLASH_ATTENTION: "1"
    # GPU passthrough. Requires WSL2 with the NVIDIA Container Toolkit; if the container
    # fails to start, delete this `deploy` block and Ollama will run on CPU instead.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  avataar_db_data:
  ollama_models:
